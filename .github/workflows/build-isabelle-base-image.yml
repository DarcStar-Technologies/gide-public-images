name: Build & Push gide-isabelle-base Image

# PUBLIC TOOLCHAIN REPO (darcstar-technologies/gide-public-images).
#
# Builds the generic Isabelle + AFP + Complex_Bounded_Operators (CBO)
# toolchain base image (Ubuntu + Isabelle distribution + AFP source +
# pre-baked CBO heap chain). This image is pure toolchain: it carries NO
# GIDE proof content. The theorem-baking overlay (`gide-isabelle`) and
# the proof-verification catalog live in the private
# DarcStar-Technologies/gide repo, which builds the overlay FROM this
# published base.
#
# The workflow implements the verify-then-promote pattern:
#   1. Build the base candidate and push as `:candidate-<sha>`.
#   2. Run a self-contained TOOLCHAIN SMOKE test inside the candidate
#      image: an inline `SmokeToolchain` theory that imports the
#      pre-baked CBO heap and proves a trivial lemma. This confirms the
#      baked heap loads (and thus the AFP/Isabelle pairing is intact)
#      without referencing any GIDE proof.
#   3. On smoke-green, retag the base candidate as `:latest` (and
#      `:<sha>`). The candidate tag is left in place for forensics.
#
# IMPORTANT — the smoke here is a TOOLCHAIN sanity check only (does the
# pre-baked CBO heap load). It deliberately does NOT verify the GIDE
# proof catalog (not present in this repo). The proof gate happens at
# ADOPTION time in the private repo: the overlay pins this base by digest
# and a Renovate digest-bump PR runs `ci-formal-theorems` before adopting
# the new base. `:latest` here is "toolchain-good"; the private pin is
# "proof-verified". See migration plan §2.7.
#
# Triggers:
#   - push to main of `tools/isabelle-base.Dockerfile` or this workflow
#   - weekly cron (Sunday 05:00 UTC) for Ubuntu / glibc CVE refreshes
#   - workflow_dispatch with optional `isabelle_version` / `afp_*`
#     inputs for one-off bumps without a Dockerfile edit
#
# Source tarballs arrive via `COPY --from=` of the GHCR mirror images
# (gide-isabelle-source / gide-afp-source), which live in THIS same
# public repo (populated by `mirror-isabelle-distribution.yml`).
#
# BUMP ORDERING (Isabelle / AFP version change): the mirror does NOT
# auto-rebuild a *different* base — this Dockerfile FROM-s a specific
# mirror tag via its `ISABELLE_VERSION` / `AFP_DATED_TAG` ARGs. To move
# to a new version: (1) run `mirror-isabelle-distribution.yml` to publish
# the new dated source tags, THEN (2) bump the ARG defaults in
# `tools/isabelle-base.Dockerfile` (or pass the workflow_dispatch inputs)
# so this base consumes them. A plain monthly mirror cron only refreshes
# the existing tags and does not by itself change what this base builds.
#
# linux/amd64-only for now: the bundled PolyML 5.9.2-2 in Isabelle
# 2025-2 ships an `arm64-linux` binary that SIGILLs at the Pure session
# bootstrap on some ARM CPUs (`Illegal instruction (core dumped)`),
# evidently using ARMv8 instruction extensions the runner doesn't
# implement. Flipping arm64 back on is a one-liner once the upstream
# PolyML bundle is fixed (or we rebuild PolyML from source inside the
# Dockerfile).

on:
  push:
    branches: [main]
    paths:
      - "tools/isabelle-base.Dockerfile"
      - ".github/workflows/build-isabelle-base-image.yml"
  pull_request:
    paths:
      - "tools/isabelle-base.Dockerfile"
      - ".github/workflows/build-isabelle-base-image.yml"
  schedule:
    # Weekly Sunday 05:00 UTC for Ubuntu / glibc CVE refreshes. The slow
    # CBO bake lives in this base, so the cron drives the heavy rebuild.
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      isabelle_version:
        description: "Isabelle version tag (default: image ARG default)"
        required: false
        default: ""
      afp_url:
        description: "AFP source tarball URL (default: image ARG default)"
        required: false
        default: ""
      afp_sha256:
        description: "AFP tarball SHA-256 (must match afp_url)"
        required: false
        default: ""
      afp_dirname:
        description: "AFP extracted directory name (default: image ARG default)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

# Serialize publishing on `gide-isabelle-base-publish` so two base-
# driven publishes never race on `gide-isabelle-base:latest`. PR runs
# scope to their own group so iterating commits cancels in-flight smoke
# builds.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gide-isabelle-base-pr-{0}', github.event.pull_request.number) || 'gide-isabelle-base-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASE_IMAGE: ghcr.io/darcstar-technologies/gide-isabelle-base
  CANDIDATE_TAG: candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build-base:
    name: Build base (Isabelle + AFP + CBO heap)
    if: github.event_name != 'pull_request'
    # TODO(migration): GitHub-hosted standard public runner = 4 vCPU /
    # 16 GB / amd64 (FREE for public repos). The Dockerfile's CBO heap
    # chain peaks at ~12 GB under 64-bit PolyML + `-j 2`, which fits 16
    # GB but with thin headroom; cold builds run ~90-150 min. If the
    # heap bake OOMs or trips the timeout on the standard runner, switch
    # to a GitHub larger runner (e.g. `ubuntu-latest-8-cores` or a
    # 16GB+ tier) — public repos CAN use larger runners but they are
    # BILLED, whereas standard `ubuntu-24.04` is free. amd64-only.
    runs-on: ubuntu-24.04
    # 90-150 min wall-clock for the cold CBO heap chain under `-j 2`.
    # Registry-backed buildkit cache (see the build step) makes warm runs
    # fast; only the changed layer rebuilds.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Auth MUST come before `Set up Docker Buildx` so the
      # docker-container builder mounts `~/.docker/config.json` with
      # GHCR credentials already populated. Reversing this order
      # produces an empty-auth buildkit container that falls back to
      # anonymous pulls and 401s on the mirror source FROMs
      # (gide-isabelle-source / gide-afp-source).
      - name: Authenticate to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Resolve build args
        id: args
        env:
          ISABELLE_VERSION: ${{ inputs.isabelle_version }}
          AFP_URL: ${{ inputs.afp_url }}
          AFP_SHA256: ${{ inputs.afp_sha256 }}
          AFP_DIRNAME: ${{ inputs.afp_dirname }}
        run: |
          # The Dockerfile no longer uses AFP_URL — the AFP tarball
          # arrives via `COPY --from=ghcr.io/.../gide-afp-source:<tag>`.
          # Derive the dated tag from the URL so the legacy
          # workflow_dispatch input still works:
          #
          #   https://isa-afp.org/release/afp-2026-02-06.tar.gz
          #   -> afp-2026-02-06
          #
          # If the in-tree default ARG covers your bump, leave the
          # dispatch input empty.
          AFP_DATED_TAG=""
          if [ -n "$AFP_URL" ]; then
            AFP_DATED_TAG="${AFP_URL##*/}"
            AFP_DATED_TAG="${AFP_DATED_TAG%.tar.gz}"
          fi
          {
            echo 'build_args<<EOF_BA'
            [ -n "$ISABELLE_VERSION" ] && echo "ISABELLE_VERSION=$ISABELLE_VERSION"
            [ -n "$AFP_DATED_TAG" ]    && echo "AFP_DATED_TAG=$AFP_DATED_TAG"
            [ -n "$AFP_SHA256" ]       && echo "AFP_SHA256=$AFP_SHA256"
            [ -n "$AFP_DIRNAME" ]      && echo "AFP_DIRNAME=$AFP_DIRNAME"
            echo 'EOF_BA'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push base candidate
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: tools/isabelle-base.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.BASE_IMAGE }}:${{ env.CANDIDATE_TAG }}
          build-args: ${{ steps.args.outputs.build_args }}
          # Registry-backed buildkit cache (NOT type=gha): the ~12 GB
          # Isabelle/AFP/CBO base would blow GitHub Actions' 10 GB/repo
          # cache cap and thrash. A GHCR `:buildcache-amd64` image has no
          # cap and gives a real warm path for the slow CBO heap layers.
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}:buildcache-amd64
          cache-to: type=registry,ref=${{ env.BASE_IMAGE }}:buildcache-amd64,mode=max
          # SLSA provenance + SPDX SBOM attestations on the candidate
          # base. The promote step retags via `imagetools create`,
          # which preserves attestation referrers automatically.
          provenance: mode=max
          sbom: true

  smoke:
    name: Toolchain smoke test (CBO heap loads)
    if: github.event_name != 'pull_request'
    needs: build-base
    # TODO(migration): the smoke job only loads the pre-baked heap and
    # proves a trivial lemma, so it is light on memory; standard
    # `ubuntu-24.04` (free public runner, amd64) is ample. Keep amd64 to
    # match the amd64-only base image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_REF: ${{ env.BASE_IMAGE }}:${{ env.CANDIDATE_TAG }}
    steps:
      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull candidate base
        run: docker pull -q "$CANDIDATE_REF"

      - name: Run inline toolchain smoke theory inside candidate
        run: |
          set -euo pipefail
          # Self-contained smoke: write a SmokeToolchain theory + ROOT
          # into a workdir, mount it into the candidate base image, and
          # run `isabelle build` so the session must LOAD the pre-baked
          # Complex_Bounded_Operators heap before checking the trivial
          # lemma. If the baked heap is missing or the AFP/Isabelle
          # pairing drifted, import resolution / heap load fails and
          # this step goes red — gating promotion. No GIDE proof,
          # isabelle_daemon.py, check_proofs.py, uv, or proofs/ are
          # referenced.
          #
          # TODO(migration): import parent = `Complex_Bounded_Operators`
          # session heap. The session name comes from
          # tools/isabelle-base.Dockerfile line 168:
          #   `isabelle build -j 2 -o timeout_scale=2.0 -b Complex_Bounded_Operators`
          # `Complex_Bounded_Linear_Function` is a theory in that AFP
          # session; if that theory name ever changes upstream, swap it
          # for any theory the session exports (e.g.
          # `Complex_Bounded_Operators.Cblinfun_Code`).
          WORK="$(mktemp -d)"
          cat > "${WORK}/SmokeToolchain.thy" <<'THY'
          theory SmokeToolchain
            imports Complex_Bounded_Operators.Complex_Bounded_Linear_Function
          begin

          lemma smoke: "(2::nat) + 2 = 4" by simp

          end
          THY
          cat > "${WORK}/ROOT" <<'ROOT'
          session SmokeToolchain = Complex_Bounded_Operators +
            theories
              SmokeToolchain
          ROOT
          # TODO(migration): exact isabelle invocation. The image
          # ENTRYPOINT is `isabelle` (Dockerfile line 170), so the args
          # below are appended to it. `-d .` registers the mounted
          # session dir; building session `SmokeToolchain` (whose parent
          # is the pre-baked `Complex_Bounded_Operators` heap) forces
          # that heap to load. `-o timeout_scale=2.0` mirrors the
          # Dockerfile's slow-runner cushion. If `build` proves too
          # heavy on the free runner, an alternative is
          # `isabelle process` against a process file, but `build` is
          # the canonical heap-load confirmation.
          docker run --rm \
            -v "${WORK}:/home/isabelle/smoke:ro" \
            -w /home/isabelle/smoke \
            "$CANDIDATE_REF" \
            build -d . -o timeout_scale=2.0 -v SmokeToolchain

  promote:
    name: Promote candidate to :latest
    if: github.event_name != 'pull_request'
    needs: [build-base, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Authenticate to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Promote base candidate
        env:
          IMAGE: ${{ env.BASE_IMAGE }}
          CANDIDATE: ${{ env.CANDIDATE_TAG }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${SHA}" \
            "${IMAGE}:${CANDIDATE}"

  smoke-validate-pr:
    # PR-time gate: build the base Dockerfile with `push: false` so a
    # typo in the Isabelle download / AFP fetch / CBO bake fails CI
    # before merge. Reads the cache the publish path wrote so most
    # PRs hit warm CBO layers.
    name: Smoke-validate base
    if: github.event_name == 'pull_request'
    # TODO(migration): same runner sizing caveat as build-base — the
    # cold CBO bake wants ~12 GB; standard `ubuntu-24.04` (free, 16 GB,
    # amd64) fits but with thin headroom. Bump to a larger (billed)
    # runner if a cold-cache PR build OOMs or times out.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # `packages: read` is needed for the GHCR auth step below — the
    # Dockerfile FROM-s the mirror tags (`gide-isabelle-source`,
    # `gide-afp-source`), so smoke-validate needs to authenticate. The
    # workflow-level `permissions:` block grants `packages: write` to
    # publish jobs; this job only needs read.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Login MUST precede `Set up Docker Buildx` so the
      # docker-container builder mounts a populated
      # `~/.docker/config.json`; the Dockerfile FROM-s the GHCR mirror
      # source images.
      - name: Authenticate to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build (smoke-validate, no push)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: tools/isabelle-base.Dockerfile
          platforms: linux/amd64
          push: false
          # Pull-only registry cache (see the publish job's note); no
          # cache-to on PRs (this job only has packages: read).
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}:buildcache-amd64
