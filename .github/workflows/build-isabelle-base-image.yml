name: Build & Push gide-isabelle-base Image

# PUBLIC TOOLCHAIN REPO (darcstar-technologies/gide-public-images).
#
# Builds the generic Isabelle + AFP toolchain base image (Ubuntu +
# Isabelle distribution + AFP source + pre-baked Complex_Bounded_Operators
# (CBO) and Ordinary_Differential_Equations (ODE) heap chains). This image
# is pure toolchain: it carries NO
# GIDE proof content. The theorem-baking overlay (`gide-isabelle`) and
# the proof-verification catalog live in the private
# DarcStar-Technologies/gide repo, which builds the overlay FROM this
# published base.
#
# The workflow implements the verify-then-promote pattern:
#   1. Build the base candidate and push as `:candidate-<sha>`.
#   2. Run a self-contained TOOLCHAIN SMOKE test inside the candidate
#      image: an inline `SmokeToolchain` theory that imports the
#      pre-baked CBO heap (session parent) and the ODE heap (sibling
#      session, via `imports ...Gronwall`) and proves a trivial lemma.
#      This confirms both baked heaps load (and thus the AFP/Isabelle
#      pairing is intact) without referencing any GIDE proof.
#   3. On smoke-green, retag the base candidate as `:latest` (and
#      `:<sha>`). The candidate tag is left in place for forensics.
#
# IMPORTANT — the smoke here is a TOOLCHAIN sanity check only (do the
# pre-baked CBO + ODE heaps load). It deliberately does NOT verify the GIDE
# proof catalog (not present in this repo). The proof gate happens at
# ADOPTION time in the private repo: the overlay pins this base by digest
# and a Renovate digest-bump PR runs `ci-formal-theorems` before adopting
# the new base. `:latest` here is "toolchain-good"; the private pin is
# "proof-verified". See migration plan §2.7.
#
# Triggers:
#   - workflow_run: after "Mirror Isabelle Distribution to GHCR" COMPLETES
#     on a push (a merged Isabelle/AFP pin bump). The mirror republishes
#     the source tags first, so the new gide-*-source tags exist before
#     this build FROM-s them — no race, no manual ordering. Since #67 the
#     mirror's overall conclusion no longer gates this: the `preflight` job
#     probes the specific mirror tags this image `COPY --from=`s, so a leg
#     that failed for an artifact this build does not consume (e.g. the
#     arm64 distribution, which this amd64-only base never FROMs) cannot
#     block the rebuild.
#   - weekly cron (Sunday 05:00 UTC) for Ubuntu / glibc CVE refreshes
#   - workflow_dispatch with optional `isabelle_version` / `afp_*`
#     inputs for one-off rebuilds
#
# Source tarballs arrive via `COPY --from=` of the GHCR mirror images
# (gide-isabelle-source / gide-afp-source), which live in THIS same
# public repo (populated by `mirror-isabelle-distribution.yml`).
#
# BUMP ORDERING (Isabelle / AFP version change): open ONE PR editing the
# `ISABELLE_VERSION` / `AFP_DATED_TAG` / `AFP_SHA256` / `AFP_DIRNAME` ARGs
# in `tools/isabelle-base.Dockerfile`. On merge, the mirror picks up the
# new in-tree pins (it triggers on a push touching that Dockerfile) and
# republishes the matching gide-{isabelle,afp}-source tags; THIS build
# then runs via workflow_run against them. No manual mirror dispatch and
# no two-PR ordering. (The mirror's monthly liveness cron and manual
# override dispatches deliberately do NOT trigger a base rebuild — see
# the build-base `if:` guard.)
#
# linux/amd64-only for now: the bundled PolyML 5.9.2-2 in Isabelle
# 2025-2 ships an `arm64-linux` binary that SIGILLs at the Pure session
# bootstrap on some ARM CPUs (`Illegal instruction (core dumped)`),
# evidently using ARMv8 instruction extensions the runner doesn't
# implement. Flipping arm64 back on is a one-liner once the upstream
# PolyML bundle is fixed (or we rebuild PolyML from source inside the
# Dockerfile).

on:
  # Rebuild AFTER the source mirror republishes (a merged pin bump). The
  # `preflight` job gates this to push-triggered mirror runs whose consumed
  # tags are actually present, so the mirror's liveness cron / override
  # dispatches don't kick a ~2.5h rebuild — and a mirror leg failure that
  # left the needed tags intact no longer suppresses the publish (#67).
  workflow_run:
    workflows: ["Mirror Isabelle Distribution to GHCR"]
    types: [completed]
    branches: [main]
  schedule:
    # Weekly Sunday 05:00 UTC for Ubuntu / glibc CVE refreshes. The slow
    # CBO bake lives in this base, so the cron drives the heavy rebuild.
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      isabelle_version:
        description: "Isabelle version tag (default: image ARG default)"
        required: false
        default: ""
      isabelle_sha256:
        description: "Isabelle tarball SHA-256 (must match isabelle_version; default: image ARG default)"
        required: false
        default: ""
      afp_url:
        description: "AFP source tarball URL (default: image ARG default)"
        required: false
        default: ""
      afp_sha256:
        description: "AFP tarball SHA-256 (must match afp_url)"
        required: false
        default: ""
      afp_dirname:
        description: "AFP extracted directory name (default: image ARG default)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

# Serialize publishing on `gide-isabelle-base-publish` so two base-
# driven publishes never race on `gide-isabelle-base:latest`.
concurrency:
  group: gide-isabelle-base-publish
  cancel-in-progress: false

env:
  BASE_IMAGE: ghcr.io/darcstar-technologies/gide-isabelle-base
  CANDIDATE_TAG: candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # Gate the rebuild on the mirror tags this build actually CONSUMES, not on
  # the mirror run's overall conclusion (#67).
  #
  # The old gate was `workflow_run.conclusion == 'success'`. That fused two
  # unrelated questions — "did every mirror leg succeed?" versus "are the
  # tarballs I need available?" — and answered the second with the first. In
  # #66 (merge db1a60a) that cost a publish: the AFP leg published
  # `gide-afp-source:afp-2026-07-21` fine, the untouched Isabelle-distribution
  # legs failed on an unreachable `dist.isabelle.cit.tum.de:80`, the run
  # concluded `failure`, and this build skipped twice (runs 30511385226,
  # 30512168780) even though BOTH tarballs it needed were sitting in GHCR. It
  # had to be published by manual dispatch (run 30513573516).
  #
  # This preflight asks the real question instead: do the two `COPY --from=`
  # refs resolve? It is strictly SAFER than the conclusion gate, not looser —
  # a mirror leg that fails while its tag is genuinely absent still blocks the
  # build, and a leg that fails for a tag we do not consume (arm64, which this
  # amd64-only base never FROMs) no longer blocks anything.
  preflight:
    name: Preflight (mirror tags present?)
    # Still ignore the mirror's liveness cron and out-of-band override
    # dispatches — those must not kick a multi-hour rebuild. Note the
    # `conclusion` check is deliberately GONE; a failed mirror run whose
    # relevant tag exists is now a legitimate trigger.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Probe the mirror tags this build FROMs
        id: probe
        env:
          # Same override precedence as `Resolve build args` below: dispatch
          # inputs win, else the in-tree ARG defaults.
          ISABELLE_VERSION_IN: ${{ inputs.isabelle_version }}
          AFP_URL_IN: ${{ inputs.afp_url }}
        run: |
          set -euo pipefail
          iv="${ISABELLE_VERSION_IN:-}"
          [ -n "$iv" ] || iv="$(grep -m1 '^ARG ISABELLE_VERSION=' tools/isabelle-base.Dockerfile | sed 's/^ARG ISABELLE_VERSION=//')"
          at=""
          if [ -n "$AFP_URL_IN" ]; then at="${AFP_URL_IN##*/}"; at="${at%.tar.gz}"; fi
          [ -n "$at" ] || at="$(grep -m1 '^ARG AFP_DATED_TAG=' tools/isabelle-base.Dockerfile | sed 's/^ARG AFP_DATED_TAG=//')"

          owner_lower=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # This base is amd64-only (bundled PolyML SIGILLs on arm64), so it
          # FROMs the `-amd64` distribution tag only. An arm64 mirror failure is
          # irrelevant to it and must not gate it.
          isabelle_ref="ghcr.io/${owner_lower}/gide-isabelle-source:${iv}-amd64"
          afp_ref="ghcr.io/${owner_lower}/gide-afp-source:${at}"

          ready=true
          for ref in "${isabelle_ref}" "${afp_ref}"; do
            if docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then
              echo "✓ present: ${ref}"
            else
              echo "::warning::missing mirror tag: ${ref}"
              ready=false
            fi
          done

          echo "ready=${ready}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Preflight"
            echo ""
            echo "- \`${isabelle_ref}\`"
            echo "- \`${afp_ref}\`"
            echo ""
            if [ "${ready}" = "true" ]; then
              echo "Both mirror tags present — proceeding with the base rebuild."
            else
              echo "**Skipping the base rebuild**: a mirror tag this image \`COPY --from=\`s is absent."
              echo "Re-run the mirror for the missing leg, then re-dispatch this workflow."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  build-base:
    name: Build base (Isabelle + AFP + CBO heap)
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    # TODO(migration): GitHub-hosted standard public runner = 4 vCPU /
    # 16 GB / amd64 (FREE for public repos). The Dockerfile bakes the
    # heaps at `-j 1` (one session at a time) under 64-bit PolyML with a
    # 6 GB ML heap cap, so peak memory stays ~6 GB — comfortable on 16 GB.
    # If the bake OOMs or trips the timeout on the standard runner, switch
    # to a GitHub larger runner (e.g. `ubuntu-latest-8-cores` or a
    # 16GB+ tier) — public repos CAN use larger runners but they are
    # BILLED, whereas standard `ubuntu-24.04` is free. amd64-only.
    runs-on: ubuntu-24.04
    # ~90-150 min for the cold CBO heap chain at `-j 1`, plus the added
    # ODE base session and its support deps (HOL-Decision_Procs, Triangle,
    # List-Index, Affine_Arithmetic, then the ODE theories incl. Gronwall
    # — gpi#17). The 300 min cap leaves headroom over the worst case while
    # staying under GitHub's 6h job limit; registry buildcache makes warm
    # runs fast (only the changed layer rebuilds).
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Auth MUST come before `Set up Docker Buildx` so the
      # docker-container builder mounts `~/.docker/config.json` with
      # GHCR credentials already populated. Reversing this order
      # produces an empty-auth buildkit container that falls back to
      # anonymous pulls and 401s on the mirror source FROMs
      # (gide-isabelle-source / gide-afp-source).
      - name: Authenticate to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Resolve build args
        id: args
        env:
          ISABELLE_VERSION: ${{ inputs.isabelle_version }}
          ISABELLE_SHA256: ${{ inputs.isabelle_sha256 }}
          AFP_URL: ${{ inputs.afp_url }}
          AFP_SHA256: ${{ inputs.afp_sha256 }}
          AFP_DIRNAME: ${{ inputs.afp_dirname }}
        run: |
          # The Dockerfile no longer uses AFP_URL — the AFP tarball
          # arrives via `COPY --from=ghcr.io/.../gide-afp-source:<tag>`.
          # Derive the dated tag from the URL so the legacy
          # workflow_dispatch input still works:
          #
          #   https://isa-afp.org/release/afp-2026-02-06.tar.gz
          #   -> afp-2026-02-06
          #
          # If the in-tree default ARG covers your bump, leave the
          # dispatch input empty.
          AFP_DATED_TAG=""
          if [ -n "$AFP_URL" ]; then
            AFP_DATED_TAG="${AFP_URL##*/}"
            AFP_DATED_TAG="${AFP_DATED_TAG%.tar.gz}"
          fi
          {
            echo 'build_args<<EOF_BA'
            [ -n "$ISABELLE_VERSION" ] && echo "ISABELLE_VERSION=$ISABELLE_VERSION"
            [ -n "$ISABELLE_SHA256" ]  && echo "ISABELLE_SHA256=$ISABELLE_SHA256"
            [ -n "$AFP_DATED_TAG" ]    && echo "AFP_DATED_TAG=$AFP_DATED_TAG"
            [ -n "$AFP_SHA256" ]       && echo "AFP_SHA256=$AFP_SHA256"
            [ -n "$AFP_DIRNAME" ]      && echo "AFP_DIRNAME=$AFP_DIRNAME"
            echo 'EOF_BA'
          } >> "$GITHUB_OUTPUT"

      - name: Resolve image metadata (OCI labels)
        id: meta
        env:
          ISABELLE_VERSION_IN: ${{ inputs.isabelle_version }}
          AFP_URL_IN: ${{ inputs.afp_url }}
        run: |
          set -euo pipefail
          iv="${ISABELLE_VERSION_IN:-}"
          [ -n "$iv" ] || iv="$(grep -m1 '^ARG ISABELLE_VERSION=' tools/isabelle-base.Dockerfile | sed 's/^ARG ISABELLE_VERSION=//')"
          at=""
          if [ -n "$AFP_URL_IN" ]; then at="${AFP_URL_IN##*/}"; at="${at%.tar.gz}"; fi
          [ -n "$at" ] || at="$(grep -m1 '^ARG AFP_DATED_TAG=' tools/isabelle-base.Dockerfile | sed 's/^ARG AFP_DATED_TAG=//')"
          echo "version=${iv}-${at}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push base candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: tools/isabelle-base.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.BASE_IMAGE }}:${{ env.CANDIDATE_TAG }}
          build-args: ${{ steps.args.outputs.build_args }}
          # Config-level OCI labels — override the ones inherited from the
          # `FROM ubuntu:26.04` runtime base (title=ubuntu, version=26.04,
          # created=<ubuntu build date>) so `docker inspect` shows THIS
          # image's metadata, consistent with the index annotations stamped
          # at promote. source/description are set in the Dockerfile.
          labels: |
            org.opencontainers.image.title=gide-isabelle-base
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/changelogs/gide-isabelle-base.md
          # Registry-backed buildkit cache (NOT type=gha): the ~12 GB
          # Isabelle/AFP/CBO base would blow GitHub Actions' 10 GB/repo
          # cache cap and thrash. A GHCR `:buildcache-amd64` image has no
          # cap and gives a real warm path for the slow CBO heap layers.
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}:buildcache-amd64
          cache-to: type=registry,ref=${{ env.BASE_IMAGE }}:buildcache-amd64,mode=max
          # SLSA provenance + SPDX SBOM attestations on the candidate
          # base. The promote step retags via `imagetools create`,
          # which preserves attestation referrers automatically.
          provenance: mode=max
          sbom: true

  smoke:
    name: Toolchain smoke test (CBO + ODE heaps load)
    if: github.event_name != 'pull_request'
    needs: build-base
    # TODO(migration): the smoke job only loads the pre-baked heap and
    # proves a trivial lemma, so it is light on memory; standard
    # `ubuntu-24.04` (free public runner, amd64) is ample. Keep amd64 to
    # match the amd64-only base image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull candidate base
        run: docker pull -q "${{ env.BASE_IMAGE }}:${{ env.CANDIDATE_TAG }}"

      - name: Run inline toolchain smoke theory inside candidate
        run: |
          set -euo pipefail
          # Self-contained smoke: write a SmokeToolchain theory + ROOT
          # into a workdir, mount it into the candidate base image, and
          # run `isabelle build` so the session must LOAD both pre-baked
          # heaps before checking the trivial lemma:
          #   - Complex_Bounded_Operators (the session PARENT), and
          #   - Ordinary_Differential_Equations (a sibling session,
          #     declared via `sessions` and pulled in by an `imports
          #     ...Gronwall` line — gpi#17).
          # If either baked heap is missing or the AFP/Isabelle pairing
          # drifted, import resolution / heap load fails and this step
          # goes red — gating promotion. No GIDE proof, isabelle_daemon.py,
          # check_proofs.py, uv, or proofs/ are referenced.
          #
          # The session names come from the bake invocation in
          # tools/isabelle-base.Dockerfile:
          #   `isabelle build -j 1 -o timeout_scale=2.0 \
          #       -b Complex_Bounded_Operators Ordinary_Differential_Equations`
          # `Complex_Bounded_Linear_Function` and `Gronwall` are theories
          # those AFP sessions export; if a theory name ever changes
          # upstream, swap it for any theory the session exports (e.g.
          # `Complex_Bounded_Operators.Cblinfun_Code`).
          WORK="$(mktemp -d)"
          cat > "${WORK}/SmokeToolchain.thy" <<'THY'
          theory SmokeToolchain
            imports
              Complex_Bounded_Operators.Complex_Bounded_Linear_Function
              Ordinary_Differential_Equations.Gronwall
          begin

          lemma smoke: "(2::nat) + 2 = 4" by simp

          end
          THY
          # Parent = the CBO heap; `sessions Ordinary_Differential_Equations`
          # makes the sibling ODE heap available so the Gronwall import
          # resolves from its pre-baked image (gpi#17, AC #2). Both heaps
          # must already exist in the image or the build fails here.
          cat > "${WORK}/ROOT" <<'ROOT'
          session SmokeToolchain = Complex_Bounded_Operators +
            sessions
              Ordinary_Differential_Equations
            theories
              SmokeToolchain
          ROOT
          # TODO(migration): exact isabelle invocation. The image
          # ENTRYPOINT is `isabelle`, so the args below are appended to
          # it. `-d .` registers the mounted session dir; building session
          # `SmokeToolchain` forces both pre-baked heaps to load — its
          # parent `Complex_Bounded_Operators` and the `sessions`-declared
          # `Ordinary_Differential_Equations` (whose `Gronwall` theory the
          # smoke imports). `-o timeout_scale=2.0` mirrors the Dockerfile's
          # slow-runner cushion. If `build` proves too heavy on the free
          # runner, an alternative is `isabelle process` against a process
          # file, but `build` is the canonical heap-load confirmation.
          docker run --rm \
            -v "${WORK}:/home/isabelle/smoke:ro" \
            -w /home/isabelle/smoke \
            "${{ env.BASE_IMAGE }}:${{ env.CANDIDATE_TAG }}" \
            build -d . -o timeout_scale=2.0 -v SmokeToolchain

  promote:
    name: Promote candidate to :latest
    if: github.event_name != 'pull_request'
    needs: [build-base, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # publish a GitHub Release per version (Phase 2, #29)
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Resolve version tag (Isabelle + AFP)
        id: ver
        env:
          ISABELLE_VERSION_IN: ${{ inputs.isabelle_version }}
          AFP_URL_IN: ${{ inputs.afp_url }}
        run: |
          set -euo pipefail
          # Composite human tag: Isabelle version + AFP dated release, since
          # AFP can refresh within one Isabelle line (e.g. afp-2026-02-06 ->
          # afp-2026-06-01 both on Isabelle2025-2). Dispatch inputs override
          # the in-tree ARG defaults; the AFP dated tag derives from the
          # afp_url input the same way the build-args resolver does.
          iv="${ISABELLE_VERSION_IN:-}"
          if [ -z "$iv" ]; then
            iv="$(grep -m1 '^ARG ISABELLE_VERSION=' tools/isabelle-base.Dockerfile | sed 's/^ARG ISABELLE_VERSION=//')"
          fi
          at=""
          if [ -n "$AFP_URL_IN" ]; then at="${AFP_URL_IN##*/}"; at="${at%.tar.gz}"; fi
          if [ -z "$at" ]; then
            at="$(grep -m1 '^ARG AFP_DATED_TAG=' tools/isabelle-base.Dockerfile | sed 's/^ARG AFP_DATED_TAG=//')"
          fi
          echo "version=${iv}-${at}" >> "$GITHUB_OUTPUT"
          echo "version tag: ${iv}-${at}"

      - name: Promote base candidate
        env:
          IMAGE: ${{ env.BASE_IMAGE }}
          CANDIDATE: ${{ env.CANDIDATE_TAG }}
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `:latest` (rolling), `:${version}` (e.g.
          # Isabelle2025-2-afp-2026-06-01; human/matrix pin), `:${sha}`
          # (forensic) all point at the verified candidate.
          #
          # OCI image annotations stamped at the index level (provenance +
          # documentation -> this image's changelog). image.source/description
          # are config labels set in the Dockerfile. `created` is RFC 3339 UTC
          # build time.
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DOC="https://github.com/${REPO}/blob/main/changelogs/gide-isabelle-base.md"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --annotation "index:org.opencontainers.image.revision=${SHA}" \
            --annotation "index:org.opencontainers.image.created=${CREATED}" \
            --annotation "index:org.opencontainers.image.documentation=${DOC}" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:${SHA}" \
            "${IMAGE}:${CANDIDATE}"

      # Phase 2 (#29): auto-create/update a GitHub Release per image-version on
      # publish — the automated publish feed (digest + provenance) that records
      # every publish incl. weekly CVE rebuilds, which carry no bump PR. The
      # curated changelogs/<image>.md (human-authored upstream notes) is kept
      # current by the Phase-1 gate on bump PRs. Non-blocking: the image is
      # already live, so a release hiccup must not red the publish.
      - name: Publish GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.BASE_IMAGE }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')"
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          TAG="gide-isabelle-base-${VERSION}"
          NOTES="$(mktemp)"
          {
            echo "Published \`${IMAGE}:${VERSION}\` — Isabelle + AFP + pre-baked CBO & ODE heaps (amd64)."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Built | ${CREATED} from \`${SHA}\` |"
            echo "| Pull | \`docker pull ${IMAGE}@${DIGEST}\` |"
            echo ""
            echo "- Changelog & upstream notes: https://github.com/${REPO}/blob/main/changelogs/gide-isabelle-base.md"
            echo "- Inspect: \`docker buildx imagetools inspect ${IMAGE}:${VERSION}\`"
            echo "- SLSA provenance + SPDX SBOM attached as OCI referrers."
          } > "$NOTES"
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$REPO" --title "gide-isabelle-base ${VERSION}" --notes-file "$NOTES" --latest=false
            echo "updated release $TAG -> ${DIGEST}"
          else
            gh release create "$TAG" -R "$REPO" --title "gide-isabelle-base ${VERSION}" --notes-file "$NOTES" --target "$SHA" --latest=false
            echo "created release $TAG -> ${DIGEST}"
          fi
