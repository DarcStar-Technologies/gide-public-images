name: Mirror Isabelle Distribution to GHCR

# MIGRATED (public repo darcstar-technologies/gide-public-images). Must stay
# on GitHub-hosted runners: Blacksmith cannot egress to TUM / isa-afp.org. Pure
# upstream tarball mirroring, no GIDE content. Image refs are org-scoped and
# unchanged.
#
# Mirrors the Isabelle distribution tarballs and the AFP source archive
# from upstream (`isabelle.in.tum.de` / `isa-afp.org`) into GIDE-owned
# GHCR repositories so `tools/isabelle-base.Dockerfile` builds can pull
# their source from a CI-internal cache instead of egressing to TUM /
# AFP on every build.
#
# Why: #1473 — `build-isabelle-image.yml`'s inline base build hits
# repeated curl timeouts to `isabelle.in.tum.de:443` from the Blacksmith
# runner pool. Upstream is reachable from GitHub-hosted runners, just
# not from Blacksmith. The retry hardening in
# `tools/isabelle-base.Dockerfile:60-74` (introduced in #1209) protects
# against transient outages but cannot help when the path is
# persistently unreachable for the entire retry window. Mirroring to
# GHCR removes the runtime dependency on TUM/AFP egress: builds pull
# from `ghcr.io/<org>/gide-isabelle-source:<version>` (and the AFP
# equivalent) which the Blacksmith pool can already reach (it pulls
# every other GIDE image from GHCR routinely).
#
# Phase A (this workflow): populate the mirror. Phase B (follow-up):
# update `tools/isabelle-base.Dockerfile` to consume the mirror via a
# multi-stage `COPY --from=ghcr.io/.../gide-isabelle-source:<tag>`.
# Phase B is gated on the mirror being populated first — that's why
# this is split into two PRs.
#
# Triggers:
#   - push to main of this workflow file OR tools/isabelle-base.Dockerfile.
#     A merged Isabelle/AFP pin bump in the Dockerfile re-runs the mirror
#     with the new in-tree pins, publishing the matching source tags;
#     build-isabelle-base then consumes them via workflow_run.
#   - workflow_dispatch with optional version/AFP overrides for one-off,
#     out-of-band tags (does NOT trigger a base rebuild).
#   - monthly cron (1st of each month, 04:00 UTC) — refresh against
#     upstream to detect URL drift / SHA churn early. The mirror itself
#     is content-stable per (version, AFP date) tag, so the cron is a
#     liveness check, not a content refresh.
#
# Runner choice: `ubuntu-latest` (GitHub-hosted), NOT Blacksmith.
# The whole point of the mirror is that GitHub-hosted runners can reach
# `isabelle.in.tum.de` and `isa-afp.org`, but Blacksmith cannot. Running
# this workflow on Blacksmith would defeat the purpose.
#
# Mirror image format: minimal `FROM scratch` wrapper with the tarball
# at `/distribution.tar.gz` (Isabelle) or `/afp.tar.gz` (AFP). Pulled
# via multi-stage Dockerfile `COPY --from=...:<tag> /distribution.tar.gz`
# in the consumer (Phase B). No layer overhead, no apt baseline, no
# surprises — just the upstream tarball under a stable, content-
# addressable path.
#
# SHA-256 verification: every push validates the upstream SHA against
# the in-tree pin (or the dispatch input). This is the boundary where
# upstream tarball corruption / MITM / accidental URL drift gets
# caught — the consumer trusts the mirror, so the mirror has to be
# authoritative about what it's mirroring.
#
# Per-architecture tagging (Isabelle): Isabelle ships a separate
# tarball per arch (`linux` for amd64, `linux_arm` for arm64) because
# the bundled PolyML differs. Mirror tags reflect this:
#   - `gide-isabelle-source:Isabelle2025-2-amd64`
#   - `gide-isabelle-source:Isabelle2025-2-arm64`
# AFP source is architecture-independent so the AFP mirror is single-
# tagged: `gide-afp-source:afp-2026-06-01`.
#
# LEG INDEPENDENCE (#67). The two artifacts mirrored here — the Isabelle
# distribution and the AFP source archive — are independent: different
# upstream hosts, different cadences (AFP refreshes repeatedly within one
# Isabelle line). Each is now a separate call to the reusable
# `mirror-tarball.yml`, which:
#
#   - skips the upstream fetch entirely when the target tag already exists,
#     so an unchanged pin never contacts its upstream host, and
#   - fails on its own without dragging the other leg down.
#
# The downstream consumer no longer gates on THIS run's overall conclusion
# either — `build-isabelle-base-image.yml` preflights the specific mirror
# tags it consumes. Together that closes the failure mode from #66/db1a60a:
# an AFP-only bump whose AFP leg published fine was blocked because the
# untouched Isabelle-distribution legs died on `dist.isabelle.cit.tum.de:80`
# being unreachable — a re-download that, with skip-if-exists, would never
# have been attempted.

on:
  workflow_dispatch:
    inputs:
      isabelle_version:
        description: "Isabelle version (default: in-tree pin from tools/isabelle-base.Dockerfile)"
        required: false
        default: ""
      afp_dated_tag:
        description: "AFP dated tag (default: in-tree pin)"
        required: false
        default: ""
      afp_url:
        description: "AFP tarball URL (default: derived from afp_dated_tag)"
        required: false
        default: ""
      afp_sha256:
        description: "AFP tarball SHA-256 (default: in-tree pin)"
        required: false
        default: ""
      mirror_arches:
        description: "JSON array of arches to mirror Isabelle for (default: [\"amd64\",\"arm64\"])"
        required: false
        default: '["amd64","arm64"]'
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-isabelle-distribution.yml"
      # A merged Isabelle/AFP pin bump in the base Dockerfile re-runs the
      # mirror with the new in-tree pins (the resolver reads
      # ISABELLE_VERSION / AFP_DATED_TAG / AFP_SHA256 from it), publishing
      # the matching source tags. build-isabelle-base then rebuilds via
      # workflow_run, so the new gide-*-source tag exists before it FROMs.
      - "tools/isabelle-base.Dockerfile"
  schedule:
    # Monthly liveness check: 04:00 UTC on the 1st. Cheap if the
    # (version, AFP date) tags already exist (the workflow is
    # idempotent — re-pushing the same content is a no-op at the
    # registry layer with `cache-from` on warm cache).
    - cron: "0 4 1 * *"

permissions:
  contents: read
  packages: write

# Serialize concurrent runs so two pushes don't race on
# `gide-isabelle-source:<tag>`. Manual dispatch + cron + push must all
# share the group. Workflow runtime is bounded by the upstream tarball
# size (~1 GB Isabelle + ~700 MB AFP), so cancel-in-progress would
# trash an in-flight upload — leave it false.
concurrency:
  group: gide-isabelle-mirror-publish
  cancel-in-progress: false

jobs:
  resolve-pins:
    name: Resolve version pins
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      isabelle_version: ${{ steps.pins.outputs.isabelle_version }}
      afp_dated_tag: ${{ steps.pins.outputs.afp_dated_tag }}
      afp_url: ${{ steps.pins.outputs.afp_url }}
      afp_sha256: ${{ steps.pins.outputs.afp_sha256 }}
      afp_dirname: ${{ steps.pins.outputs.afp_dirname }}
      mirror_arches: ${{ steps.pins.outputs.mirror_arches }}
      isabelle_mirror_image: ${{ steps.pins.outputs.isabelle_mirror_image }}
      afp_mirror_image: ${{ steps.pins.outputs.afp_mirror_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve pins from inputs or in-tree Dockerfile
        id: pins
        env:
          # Pass dispatch inputs via env, never inline `${{ }}` in the
          # script. `mirror_arches` is a JSON array whose embedded
          # double-quotes collide with the shell's own quoting when
          # substituted inline (`"["amd64","arm64"]"` -> `[amd64,arm64]`),
          # producing invalid JSON that breaks the Isabelle matrix's
          # `fromJSON` and the summary's `jq`. Reading from env keeps the
          # value intact (and avoids input-injection into the script).
          INPUT_ISABELLE: ${{ github.event.inputs.isabelle_version }}
          INPUT_AFP_TAG: ${{ github.event.inputs.afp_dated_tag }}
          INPUT_AFP_URL: ${{ github.event.inputs.afp_url }}
          INPUT_AFP_SHA: ${{ github.event.inputs.afp_sha256 }}
          INPUT_ARCHES: ${{ github.event.inputs.mirror_arches }}
        run: |
          set -euo pipefail
          # Extract the in-tree ARG defaults from tools/isabelle-base.Dockerfile.
          # Each ARG NAME=VALUE appears on its own line; grep + sed extracts the
          # value side. workflow_dispatch inputs override when non-empty.
          extract_arg() {
            local name="$1"
            grep -m1 "^ARG ${name}=" tools/isabelle-base.Dockerfile | sed -E "s|^ARG ${name}=||"
          }

          input_isabelle="${INPUT_ISABELLE:-}"
          input_afp_tag="${INPUT_AFP_TAG:-}"
          input_afp_url="${INPUT_AFP_URL:-}"
          input_afp_sha="${INPUT_AFP_SHA:-}"
          input_arches="${INPUT_ARCHES:-}"

          isabelle_version="${input_isabelle:-$(extract_arg ISABELLE_VERSION)}"
          afp_sha256="${input_afp_sha:-$(extract_arg AFP_SHA256)}"
          afp_dirname="$(extract_arg AFP_DIRNAME)"

          # AFP is pinned in-tree by its dated tag (ARG AFP_DATED_TAG, e.g.
          # `afp-2026-02-06`); a workflow_dispatch afp_dated_tag input
          # overrides it. The tarball URL is derived from the dated tag
          # (`https://isa-afp.org/release/<tag>.tar.gz`) unless an explicit
          # afp_url input is supplied.
          afp_dated_tag="${input_afp_tag:-$(extract_arg AFP_DATED_TAG)}"
          afp_url="${input_afp_url:-https://isa-afp.org/release/${afp_dated_tag}.tar.gz}"

          # mirror_arches is a JSON array string (default
          # `["amd64","arm64"]`), passed through to the matrix job via
          # `fromJSON()`. The default is supplied here when no
          # workflow_dispatch input was provided (push/cron triggers).
          mirror_arches="${input_arches:-[\"amd64\",\"arm64\"]}"

          # Validate the arch list HERE. The per-arch upstream URL is now built
          # by a GitHub expression in the mirror-isabelle job
          # (`amd64 -> linux`, else `linux_arm`), which cannot fail loudly on an
          # unknown arch the way the old inline `case` did — an unsupported
          # value would silently mirror the arm tarball under the wrong tag.
          bad=$(echo "${mirror_arches}" | jq -r '.[] | select(. != "amd64" and . != "arm64")')
          if [ -n "${bad}" ]; then
            echo "✗ Unsupported arch(es) in mirror_arches: ${bad}" >&2
            echo "  Isabelle publishes tarballs for amd64 (linux) and arm64 (linux_arm) only." >&2
            exit 1
          fi

          # GHCR rejects mixed-case repository names, but
          # `${{ github.repository_owner }}` preserves the GitHub org's
          # display case (e.g. `DarcStar-Technologies`). Lowercase it
          # here once and emit the full image refs as outputs so the
          # downstream jobs can reference them without re-doing the
          # case conversion.
          owner_lower=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          isabelle_mirror_image="ghcr.io/${owner_lower}/gide-isabelle-source"
          afp_mirror_image="ghcr.io/${owner_lower}/gide-afp-source"

          {
            echo "isabelle_version=${isabelle_version}"
            echo "afp_dated_tag=${afp_dated_tag}"
            echo "afp_url=${afp_url}"
            echo "afp_sha256=${afp_sha256}"
            echo "afp_dirname=${afp_dirname}"
            echo "isabelle_mirror_image=${isabelle_mirror_image}"
            echo "afp_mirror_image=${afp_mirror_image}"
            echo "mirror_arches=${mirror_arches}"
          } >> "${GITHUB_OUTPUT}"

          echo "Resolved pins:"
          echo "  isabelle_version: ${isabelle_version}"
          echo "  afp_dated_tag:    ${afp_dated_tag}"
          echo "  afp_url:          ${afp_url}"
          echo "  afp_sha256:       ${afp_sha256}"
          echo "  afp_dirname:      ${afp_dirname}"
          echo "  mirror_arches:    ${mirror_arches}"

  # Leg 1 of 2 (#67): the Isabelle DISTRIBUTION — one tarball per arch off
  # `isabelle.in.tum.de`, which 301s to `dist.isabelle.cit.tum.de` over plain
  # HTTP :80. `fail-fast: false` keeps one arch's failure off the other, and
  # `skip_if_exists` (the reusable workflow's default) means an unchanged
  # ISABELLE_VERSION never contacts that host at all.
  #
  # No SHA-256 is passed: Isabelle publishes no per-arch SHA file, so
  # ISABELLE_SHA256 is computed at pin-bump time and verified by the CONSUMER
  # (`tools/isabelle-base.Dockerfile`) rather than here. The reusable workflow
  # still runs `gzip -t`. Passing a single pin here would be wrong anyway — it
  # would only ever match one arch.
  mirror-isabelle:
    name: Mirror Isabelle distribution (${{ matrix.arch }})
    needs: resolve-pins
    strategy:
      fail-fast: false
      matrix:
        # `mirror_arches` is a JSON-array string from resolve-pins
        # (default `["amd64","arm64"]`); `fromJSON` parses it into the
        # matrix dimension. resolve-pins validates the members, so the
        # suffix expression below only ever sees amd64/arm64.
        arch: ${{ fromJSON(needs.resolve-pins.outputs.mirror_arches) }}
    uses: ./.github/workflows/mirror-tarball.yml
    with:
      artifact_class: Isabelle distribution (${{ matrix.arch }})
      image: ${{ needs.resolve-pins.outputs.isabelle_mirror_image }}
      tag: ${{ needs.resolve-pins.outputs.isabelle_version }}-${{ matrix.arch }}
      # Isabelle ships a separate tarball per arch (`linux` for amd64,
      # `linux_arm` for arm64) because the bundled PolyML differs.
      url: https://isabelle.in.tum.de/dist/${{ needs.resolve-pins.outputs.isabelle_version }}_${{ matrix.arch == 'amd64' && 'linux' || 'linux_arm' }}.tar.gz
      tarball_name: distribution.tar.gz

  # Leg 2 of 2 (#67): the AFP SOURCE archive — a different host
  # (`isa-afp.org`) on a different cadence. Architecture-independent, so a
  # single tag serves both amd64 and arm64 consumers.
  mirror-afp:
    name: Mirror AFP source archive
    needs: resolve-pins
    uses: ./.github/workflows/mirror-tarball.yml
    with:
      artifact_class: AFP source
      image: ${{ needs.resolve-pins.outputs.afp_mirror_image }}
      tag: ${{ needs.resolve-pins.outputs.afp_dated_tag }}
      url: ${{ needs.resolve-pins.outputs.afp_url }}
      sha256: ${{ needs.resolve-pins.outputs.afp_sha256 }}
      tarball_name: afp.tar.gz
      # AFP_DIRNAME must be the tarball's top-level directory or the
      # consumer's `ln -s /opt/afp/${AFP_DIRNAME}/thys ...` symlink dangles.
      expect_top_dir: ${{ needs.resolve-pins.outputs.afp_dirname }}

  summary:
    name: Mirror summary
    needs: [resolve-pins, mirror-isabelle, mirror-afp]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print leg outcomes
        env:
          # Per-leg RESULTS, not the run conclusion — the point of #67 is that
          # these are independent. A failed distribution leg no longer implies
          # the AFP tag is missing, and vice versa.
          ISABELLE_RESULT: ${{ needs.mirror-isabelle.result }}
          AFP_RESULT: ${{ needs.mirror-afp.result }}
          AFP_STATUS: ${{ needs.mirror-afp.outputs.status }}
          ARCHES: ${{ needs.resolve-pins.outputs.mirror_arches }}
          ISABELLE_IMAGE: ${{ needs.resolve-pins.outputs.isabelle_mirror_image }}
          ISABELLE_VERSION: ${{ needs.resolve-pins.outputs.isabelle_version }}
          AFP_IMAGE: ${{ needs.resolve-pins.outputs.afp_mirror_image }}
          AFP_TAG: ${{ needs.resolve-pins.outputs.afp_dated_tag }}
        run: |
          set -euo pipefail
          # Group all writes into a single redirect (shellcheck SC2129).
          {
            echo "## Mirror summary"
            echo ""
            echo "Legs are independent (#67) — each is reported on its own."
            echo ""
            echo "### Isabelle distribution — \`${ISABELLE_RESULT}\`"
            # mirror_arches is a JSON array string; jq parses + iterates.
            echo "${ARCHES}" | jq -r '.[]' | while read -r arch; do
              echo "- \`${ISABELLE_IMAGE}:${ISABELLE_VERSION}-${arch}\`"
            done
            echo ""
            echo "### AFP source — \`${AFP_RESULT}\` (${AFP_STATUS:-n/a})"
            echo "- \`${AFP_IMAGE}:${AFP_TAG}\`"
            echo ""
            echo "### Downstream"
            echo "\`build-isabelle-base-image.yml\` preflights the specific tags it"
            echo "consumes, so a failed leg here only blocks the base rebuild when the"
            echo "tag that leg owns is genuinely absent."
          } >> "${GITHUB_STEP_SUMMARY}"
